<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tsunagu-Pad">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<title>Tsunagu-Pad</title>
</head>
<body>
<video id="video" autoplay playsinline muted disablepictureinpicture></video>
<div id="surface"></div>
<div id="hud" hidden></div>
<div id="keybar" hidden></div>
<div id="pen-dot" hidden></div>

<div id="toolbar">
  <button id="handle" data-i18n-aria="menu"></button>
  <div class="tools">
    <button id="btn-kbd">
      <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
      <span data-i18n="keyboard"></span>
    </button>
    <button id="btn-touch">
      <svg viewBox="0 0 24 24"><path d="M9 11V5a2 2 0 0 1 4 0v5M13 10V8a2 2 0 0 1 4 0v4M17 11a2 2 0 0 1 4 0v3a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L4 15a2 2 0 0 1 3-2.6L9 14"/></svg>
      <span id="touch-label"></span>
    </button>
    <button id="btn-full">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      <span data-i18n="fullscreen"></span>
    </button>
    <button id="btn-info">
      <svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-6M22 19H2"/></svg>
      <span data-i18n="info"></span>
    </button>
    <button id="btn-keys">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9v6M12 9v6M16 9v6"/></svg>
      <span data-i18n="shortcuts"></span>
    </button>
    <button id="btn-lang">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 2.5 15.4 0 18M12 3c-2.5 2.6-2.5 15.4 0 18"/></svg>
      <span id="lang-label"></span>
    </button>
    <button id="btn-reconnect">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg>
      <span data-i18n="reconnect"></span>
    </button>
  </div>
</div>

<div id="overlay">
  <div class="card">
    <div class="brand">
      <div><strong>Tsunagu-Pad</strong><span data-i18n="tagline"></span></div>
    </div>
    <p id="status"></p>
    <div id="spinner" class="spinner"></div>
    <button id="btn-action" hidden></button>
    <p id="hint" class="hint" data-i18n="hint" hidden></p>
  </div>
</div>

<textarea id="kbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          enterkeyhint="enter" data-i18n-aria="typing"></textarea>
<script src="app.js"></script>
</body>
</html>
